    <script>

        function MyotomeGif(id){
            var el = document.getElementById("imagePlaceholder");
            var caption = document.getElementById("caption");
            
            switch (id) {
                case "C1C2: Cervical Flexion":
                    var gifSelect = "C1/C2_gif";
                    var gifSelectPath = "Images/CervFlex.gif";
                    break;
                case "C3: Cervical Lateral Flexion":
                    var gifSelect = "C3_gif";
                    var gifSelectPath = "Images/LatFlex.gif";
                    break;
                case "C4: Scapular Elevation":
                    var gifSelect = "C4_gif";
                    var gifSelectPath = "Images/ShouldElev.gif";
                    break;
                case "C5: Shoulder Abduction":
                    var gifSelect = "C5_gif";
                    var gifSelectPath = "Images/ShouldAbduct.gif";
                    break;
                case "C6: Elbow Flexion and Wrist Extension":
                    var gifSelect = "C6_gif";
                    var gifSelectPath = "Images/ElbowFlex.gif";
                    break;
                case "C7: Elbow Extension and Wrist Flexion":
                    var gifSelect = "C7_gif";
                    var gifSelectPath = "Images/ElbowExtend.gif";
                    break;
                case "C8: Thumb Extension":
                    var gifSelect = "C8_gif";
                    var gifSelectPath = "Images/ThumbExtend.gif";
                    break;
                case "T1: Finger Abduction":
                    var gifSelect = "T1_gif";
                    var gifSelectPath = "Images/FingerAbduct.gif";
                    break;
                case "L1L2: Hip Flexion":
                    var gifSelect = "L1/L2_gif";
                    var gifSelectPath = "Images/HipFlex.gif";
                    break;
                case "L3: Knee Extension":
                    var gifSelect = "L3_gif";
                    var gifSelectPath = "Images/KneeExtend.gif";
                    break;
                case "L4: Ankle Dorsiflexion":
                    var gifSelect = "L4_gif";
                    var gifSelectPath = "Images/AnkleDorsi.gif";
                    break;
                case "L5: First Toe Extension":
                    var gifSelect = "L5_gif";
                    var gifSelectPath = "Images/FirstToeExtend.gif";
                    break;
                case "S1: Ankle Plantarflexion":
                    var gifSelect = "S1_gif";
                    var gifSelectPath = "Images/AnklePlantar.gif";
                    break;
                case "S2: Knee Flexion":
                    var gifSelect = "S2_gif";
                    var gifSelectPath = "Images/KneeFlex.gif";
                    break;
            }

            
            // Disables all buttons for duration of gif
            const buttons = document.querySelectorAll("button");
            buttons.forEach(element => {
                element.disabled = true;
                // var colorArray = [];
                // colorArray.push(element.style.backgroundColor);
                // element.style.backgroundColor = "rgb(158, 173, 179)";
            });

            // Turns off all Dermatome overlays
            var dermaImgs = document.getElementsByClassName("image4");
            for (var i = 0; i < dermaImgs.length; i++) {
                dermaImgs[i].style.opacity = "0";
            }

            // Makes the caption labelled
            caption.innerHTML = id;
            
            // Hides the image, then restarts gif
            el.hidden = true;
            document.getElementById(gifSelect).style.zIndex = "10";
            document.getElementById(gifSelect).src="";
            document.getElementById(gifSelect).src=gifSelectPath;

            // Waits 6700ms, then unhides image and resets text, and enables all
            setTimeout(() => {
                el.hidden = false;
                document.getElementById(gifSelect).style.zIndex = "1";
                el.style.zIndex = "10";
                caption.innerHTML = null; //PUT STUFF TO DO ONCE TIMER RUNS OUT
                buttons.forEach((element, index) => {
                    // const color = colorArray[index % colorArray.length];
                    // element.style.backgroundColor = color;
                    element.disabled = false;
                });
            }, 6700)
    
        }
    
        function DermatomeOpacity(id){
            var caption = document.getElementById("caption");
            // const button = document.querySelector("button#myButton");
            // const alpha = button.backgroundColor.alpha;
            // console.log(alpha);

            switch (id) {
                case "C2":
                    var captionText = "C2: Occipital Protuberance";
                    break;
                case "C3":
                    var captionText = "C3: Supraclavicular Fossa";
                    break;
                case "C4":
                    var captionText = "C4: Acromioclavicular Joint";
                    break;
                case "C5":
                    var captionText = "C5: Lateral Antecubital Fossa";
                    break;
                case "C6":
                    var captionText = "C6: Thumb";
                    break;
                case "C7":
                    var captionText = "C7: Middle Finger";
                    break;
                case "C8":
                    var captionText = "C8: Little Finger";
                    break;
                case "T1":
                    var captionText = "T1: Medial Antecubital Fossa";
                    break;
                case "T2":
                    var captionText = "T2: Apex of Axilla";
                    break;
                case "L1":
                    var captionText = "L1: Upper Anterior Thigh";
                    break;
                case "L2":
                    var captionText = "L2: Mid Anterior Thigh";
                    break;
                case "L3":
                    var captionText = "L3: Medial Femoral Condyle";
                    break;
                case "L4":
                    var captionText = "L4: Medial Malleolus";
                    break;
                case "L5":
                    var captionText = "L5: Dorsum 3rd MTP Joint";
                    break;
                case "S1":
                    var captionText = "S1: Lateral Heel";
                    break;
                case "S2":
                    var captionText = "S2: Popliteal Fossa";
                    break;
                case "S3":
                    var captionText = "S3: Ischial Tuberosity";
                    break;
                case "S45":
                    var captionText = "S4-5: Perineal Area";
                    break;
            }

            var imageName = id + "img";
            image = document.getElementById(imageName);

            if (image.style.opacity === "0") {
                image.style.opacity = "1";
                image.style.zIndex = "10";
                caption.innerHTML = captionText;
                // button.style.backgroundColor
            }
            else {
                image.style.opacity = "0";
            }

        }
